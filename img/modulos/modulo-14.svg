<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d">
<title id="t">Invariante do laço do máximo</title>
<desc id="d">Lista 3, 8, 2, 9, 4. Em cada linha, a parte já examinada fica destacada e a variável maior guarda o máximo dela: 3, 8, 8, 9 e 9.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#1e293b}.t{font-size:16px;font-weight:700}.m{font-size:12px;fill:#475569}.b{font-weight:700}.c{text-anchor:middle}</style>
<rect width="640" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="20" y="28" class="t">Módulo 14 — Invariante: maior == max(lista[0..i-1])</text>
<text x="40" y="60" class="m">após cada volta (i = próximo índice a examinar)</text>
<text x="400" y="60" class="b">estado</text>
<g stroke="#6366f1" stroke-width="2">
<rect x="100" y="72" width="50" height="34" fill="#c7d2fe"/><rect x="150" y="72" width="50" height="34" fill="#fff"/><rect x="200" y="72" width="50" height="34" fill="#fff"/><rect x="250" y="72" width="50" height="34" fill="#fff"/><rect x="300" y="72" width="50" height="34" fill="#fff"/>
<rect x="100" y="112" width="50" height="34" fill="#c7d2fe"/><rect x="150" y="112" width="50" height="34" fill="#c7d2fe"/><rect x="200" y="112" width="50" height="34" fill="#fff"/><rect x="250" y="112" width="50" height="34" fill="#fff"/><rect x="300" y="112" width="50" height="34" fill="#fff"/>
<rect x="100" y="152" width="50" height="34" fill="#c7d2fe"/><rect x="150" y="152" width="50" height="34" fill="#c7d2fe"/><rect x="200" y="152" width="50" height="34" fill="#c7d2fe"/><rect x="250" y="152" width="50" height="34" fill="#fff"/><rect x="300" y="152" width="50" height="34" fill="#fff"/>
<rect x="100" y="192" width="50" height="34" fill="#c7d2fe"/><rect x="150" y="192" width="50" height="34" fill="#c7d2fe"/><rect x="200" y="192" width="50" height="34" fill="#c7d2fe"/><rect x="250" y="192" width="50" height="34" fill="#c7d2fe"/><rect x="300" y="192" width="50" height="34" fill="#fff"/>
<rect x="100" y="232" width="50" height="34" fill="#c7d2fe"/><rect x="150" y="232" width="50" height="34" fill="#c7d2fe"/><rect x="200" y="232" width="50" height="34" fill="#c7d2fe"/><rect x="250" y="232" width="50" height="34" fill="#c7d2fe"/><rect x="300" y="232" width="50" height="34" fill="#c7d2fe"/>
</g>
<g class="m"><text x="40" y="94">i = 1</text><text x="40" y="134">i = 2</text><text x="40" y="174">i = 3</text><text x="40" y="214">i = 4</text><text x="40" y="254">i = 5</text></g>
<g class="c b">
<text x="125" y="94">3</text><text x="175" y="94">8</text><text x="225" y="94">2</text><text x="275" y="94">9</text><text x="325" y="94">4</text>
<text x="125" y="134">3</text><text x="175" y="134">8</text><text x="225" y="134">2</text><text x="275" y="134">9</text><text x="325" y="134">4</text>
<text x="125" y="174">3</text><text x="175" y="174">8</text><text x="225" y="174">2</text><text x="275" y="174">9</text><text x="325" y="174">4</text>
<text x="125" y="214">3</text><text x="175" y="214">8</text><text x="225" y="214">2</text><text x="275" y="214">9</text><text x="325" y="214">4</text>
<text x="125" y="254">3</text><text x="175" y="254">8</text><text x="225" y="254">2</text><text x="275" y="254">9</text><text x="325" y="254">4</text>
</g>
<g><text x="400" y="94">maior = 3</text><text x="400" y="134">maior = 8</text><text x="400" y="174">maior = 8</text><text x="400" y="214">maior = 9</text><text x="400" y="254">maior = 9</text></g>
<text x="30" y="292" class="m">Azul = parte já examinada. A cada volta, maior continua sendo o máximo dessa parte.</text>
<text x="30" y="310" class="m">Na saída (i = 5, lista inteira), o invariante prova que maior é o máximo da lista.</text>
</svg>
