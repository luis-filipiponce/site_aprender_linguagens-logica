<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d">
<title id="t">Faixas de decisão da nota</title>
<desc id="d">Uma reta de 0 a 10 dividida em três faixas: de 0 a menos de 5 reprovado, de 5 a menos de 7 recuperação, de 7 a 10 aprovado. Abaixo, a cascata SE SENÃO SE correspondente.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#1e293b}.t{font-size:16px;font-weight:700}.m{font-size:12px;fill:#475569}.b{font-weight:700}.c{text-anchor:middle}</style>
<rect width="640" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="20" y="28" class="t">Módulo 8 — Faixas mutuamente exclusivas</text>
<rect x="40" y="60" width="280" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<rect x="320" y="60" width="120" height="60" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<rect x="440" y="60" width="160" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="180" y="96" class="c b">Reprovado</text><text x="380" y="96" class="c b">Recuperação</text><text x="520" y="96" class="c b">Aprovado</text>
<g stroke="#475569" stroke-width="2"><path d="M40 130V140M320 130V140M440 130V140M600 130V140M40 135H600"/></g>
<g class="c"><text x="40" y="158">0</text><text x="320" y="158">5,0</text><text x="440" y="158">7,0</text><text x="600" y="158">10</text></g>
<text x="180" y="176" class="c m">nota &lt; 5</text><text x="380" y="176" class="c m">5 ≤ nota &lt; 7</text><text x="520" y="176" class="c m">nota ≥ 7</text>
<rect x="40" y="196" width="560" height="100" rx="8" fill="#fff" stroke="#94a3b8"/>
<text x="60" y="222" style="font-family:Consolas,monospace">SE nota &gt;= 7.0 ENTÃO ESCREVER "Aprovado"</text>
<text x="60" y="246" style="font-family:Consolas,monospace">SENÃO SE nota &gt;= 5.0 ENTÃO ESCREVER "Recuperação"</text>
<text x="60" y="270" style="font-family:Consolas,monospace">SENÃO ESCREVER "Reprovado"</text>
<text x="590" y="286" class="m" style="text-anchor:end">A ordem importa: teste do mais restritivo ao mais amplo.</text>
</svg>
