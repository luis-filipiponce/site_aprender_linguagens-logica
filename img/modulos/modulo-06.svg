<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d">
<title id="t">Árvore de avaliação de expressão</title>
<desc id="d">Árvore para (10 + 5 * 2) > 15 E (20 % 3 == 2): 5 vezes 2 é 10, 10 mais 10 é 20, 20 maior que 15 é verdadeiro; 20 módulo 3 é 2, igual a 2 é verdadeiro; verdadeiro E verdadeiro é verdadeiro.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#1e293b}.t{font-size:16px;font-weight:700}.m{font-size:12px;fill:#475569}.b{font-weight:700}.c{text-anchor:middle}</style>
<rect width="640" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="20" y="28" class="t">Módulo 6 — Ordem de avaliação de uma expressão</text>
<g stroke="#94a3b8" stroke-width="2" fill="none">
<path d="M320 70L190 118M320 70L460 118M190 118L110 166M190 118L270 166M110 166L70 214M110 166L150 214M460 118L400 166M460 118L520 166"/>
</g>
<g stroke-width="2">
<rect x="270" y="50" width="100" height="32" rx="16" fill="#dcfce7" stroke="#16a34a"/>
<rect x="140" y="102" width="100" height="32" rx="16" fill="#dcfce7" stroke="#16a34a"/>
<rect x="410" y="102" width="100" height="32" rx="16" fill="#dcfce7" stroke="#16a34a"/>
<rect x="60" y="150" width="100" height="32" rx="16" fill="#e0e7ff" stroke="#6366f1"/>
<rect x="230" y="150" width="80" height="32" rx="16" fill="#fff" stroke="#6366f1"/>
<rect x="30" y="198" width="80" height="32" rx="16" fill="#fff" stroke="#6366f1"/>
<rect x="120" y="198" width="80" height="32" rx="16" fill="#e0e7ff" stroke="#6366f1"/>
<rect x="355" y="150" width="90" height="32" rx="16" fill="#e0e7ff" stroke="#6366f1"/>
<rect x="475" y="150" width="90" height="32" rx="16" fill="#fff" stroke="#6366f1"/>
</g>
<g class="c b">
<text x="320" y="71">E → V</text><text x="190" y="123">&gt; → V</text><text x="460" y="123">== → V</text>
<text x="110" y="171">+ → 20</text><text x="270" y="171">15</text>
<text x="70" y="219">10</text><text x="160" y="219">* → 10</text>
<text x="400" y="171">% → 2</text><text x="520" y="171">2</text>
</g>
<g class="c m">
<text x="130" y="258">5 * 2 = 10</text><text x="130" y="274">depois 10 + 10 = 20</text>
<text x="400" y="258">20 % 3 = 2 (resto)</text><text x="400" y="274">depois 2 == 2 → V</text>
<text x="320" y="304">Multiplicação e módulo antes da soma e das comparações; E por último.</text>
</g>
</svg>
