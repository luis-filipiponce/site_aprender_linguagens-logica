<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d">
<title id="t">Árvore de recursão do MergeSort</title>
<desc id="d">Árvore de recursão para T(n) = 2T(n/2) + n: cada nível soma n operações de merge e há log n níveis, totalizando n log n. Para n igual a 8 há quatro níveis de tamanhos 8, 4, 2 e 1.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#1e293b}.t{font-size:16px;font-weight:700}.m{font-size:12px;fill:#475569}.b{font-weight:700}.c{text-anchor:middle}</style>
<rect width="640" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="20" y="28" class="t">Módulo 18 — Recorrência T(n) = 2T(n/2) + n</text>
<g stroke="#94a3b8" stroke-width="1.5" fill="none">
<path d="M240 76L150 106M240 76L330 106"/>
<path d="M150 124L105 154M150 124L195 154M330 124L285 154M330 124L375 154"/>
<path d="M105 172L83 202M105 172L127 202M195 172L173 202M195 172L217 202M285 172L263 202M285 172L307 202M375 172L353 202M375 172L397 202"/>
</g>
<g stroke="#6366f1" stroke-width="2" fill="#e0e7ff">
<rect x="215" y="52" width="50" height="24" rx="12"/>
<rect x="125" y="100" width="50" height="24" rx="12"/><rect x="305" y="100" width="50" height="24" rx="12"/>
<rect x="80" y="148" width="50" height="24" rx="12" fill="#fff"/><rect x="170" y="148" width="50" height="24" rx="12" fill="#fff"/><rect x="260" y="148" width="50" height="24" rx="12" fill="#fff"/><rect x="350" y="148" width="50" height="24" rx="12" fill="#fff"/>
</g>
<g fill="#fff" stroke="#6366f1" stroke-width="2">
<circle cx="83" cy="214" r="12"/><circle cx="127" cy="214" r="12"/><circle cx="173" cy="214" r="12"/><circle cx="217" cy="214" r="12"/><circle cx="263" cy="214" r="12"/><circle cx="307" cy="214" r="12"/><circle cx="353" cy="214" r="12"/><circle cx="397" cy="214" r="12"/>
</g>
<g class="c b"><text x="240" y="69">8</text><text x="150" y="117">4</text><text x="330" y="117">4</text><text x="105" y="165">2</text><text x="195" y="165">2</text><text x="285" y="165">2</text><text x="375" y="165">2</text></g>
<g class="c"><text x="83" y="219">1</text><text x="127" y="219">1</text><text x="173" y="219">1</text><text x="217" y="219">1</text><text x="263" y="219">1</text><text x="307" y="219">1</text><text x="353" y="219">1</text><text x="397" y="219">1</text></g>
<g class="m"><text x="445" y="69">nível 0: 1 × 8 = n</text><text x="445" y="117">nível 1: 2 × 4 = n</text><text x="445" y="165">nível 2: 4 × 2 = n</text><text x="445" y="219">nível 3: 8 × 1 = n</text></g>
<rect x="30" y="246" width="580" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="320" y="269" class="c b">Cada nível custa n e há log₂ n + 1 níveis ⇒ T(n) = Θ(n log n)</text>
<text x="320" y="289" class="c m">Teorema Mestre: a = 2, b = 2, f(n) = n = n^(log_b a) ⇒ Caso 2</text>
</svg>
