<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d">
<title id="t">Autômato finito para números pares e fita de Turing</title>
<desc id="d">Autômato com dois estados: q0 inicial e de aceitação para dígitos pares, q1 para ímpares, com transições. Abaixo, a fita de uma máquina de Turing marcando a, b e c com X, Y e Z, com a cabeça de leitura sobre uma célula.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#1e293b}.t{font-size:16px;font-weight:700}.m{font-size:12px;fill:#475569}.b{font-weight:700}.c{text-anchor:middle}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="20" y="28" class="t">Módulo 21 — Autômato (DFA) e Máquina de Turing</text>
<path d="M30 112H68" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
<circle cx="110" cy="112" r="38" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="110" cy="112" r="32" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="110" y="117" class="c b">q0</text>
<circle cx="330" cy="112" r="38" fill="#fff" stroke="#6366f1" stroke-width="2"/>
<text x="330" y="117" class="c b">q1</text>
<path d="M145 96Q220 68 293 96" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="220" y="76" class="c m">dígito ímpar</text>
<path d="M293 128Q220 156 147 128" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="220" y="160" class="c m">dígito par</text>
<path d="M90 78C70 46 100 40 108 74" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="68" y="52" class="c m">par</text>
<path d="M310 78C290 46 320 40 328 74" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="288" y="52" class="c m">ímpar</text>
<rect x="430" y="64" width="180" height="84" rx="8" fill="#fff" stroke="#cbd5e1"/>
<text x="520" y="88" class="c b">Lê o último dígito</text>
<text x="520" y="110" class="c m">termina em q0 ⇒ número par</text><text x="520" y="128" class="c m">termina em q1 ⇒ ímpar</text>
<text x="30" y="196" class="b">Máquina de Turing para aⁿbⁿcⁿ (após 1 ciclo)</text>
<g stroke="#6366f1" stroke-width="2">
<rect x="50" y="208" width="46" height="40" fill="#fef3c7"/><rect x="96" y="208" width="46" height="40" fill="#fff"/><rect x="142" y="208" width="46" height="40" fill="#fff"/><rect x="188" y="208" width="46" height="40" fill="#fef3c7"/><rect x="234" y="208" width="46" height="40" fill="#fff"/><rect x="280" y="208" width="46" height="40" fill="#fff"/><rect x="326" y="208" width="46" height="40" fill="#fef3c7"/><rect x="372" y="208" width="46" height="40" fill="#fff"/><rect x="418" y="208" width="46" height="40" fill="#fff"/>
</g>
<g class="c b" font-size="18"><text x="73" y="235">X</text><text x="119" y="235">a</text><text x="165" y="235">a</text><text x="211" y="235">Y</text><text x="257" y="235">b</text><text x="303" y="235">b</text><text x="349" y="235">Z</text><text x="395" y="235">c</text><text x="441" y="235">c</text></g>
<path d="M119 288V254" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="119" y="306" class="c b" style="fill:#991b1b">cabeça (próximo a)</text>
<text x="478" y="232" class="m">Marca um a (X), um b (Y)</text><text x="478" y="250" class="m">e um c (Z) por ciclo; repete</text><text x="478" y="268" class="m">até a fita estar balanceada.</text>
<text x="478" y="294" class="m">Um DFA não sabe contar.</text>
</svg>
