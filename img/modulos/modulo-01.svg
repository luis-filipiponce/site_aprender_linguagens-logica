<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d">
<title id="t">Argumento válido versus falácia</title>
<desc id="d">Dois diagramas de conjuntos: à esquerda, 12 está dentro dos múltiplos de 4 que estão dentro dos pares; à direita, 10 é par mas fica fora dos múltiplos de 4.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#1e293b}.t{font-size:16px;font-weight:700}.m{font-size:12px;fill:#475569}.b{font-weight:700}.c{text-anchor:middle}</style>
<rect width="640" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="20" y="28" class="t">Módulo 1 — Validade de um argumento</text>
<line x1="320" y1="50" x2="320" y2="300" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<text x="165" y="62" class="c b" style="fill:#166534">A: argumento VÁLIDO</text>
<circle cx="165" cy="175" r="90" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
<circle cx="165" cy="205" r="55" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
<text x="165" y="104" class="c b">P: pares</text>
<text x="165" y="190" class="c m">múltiplos de 4 (M)</text>
<circle cx="165" cy="222" r="6" fill="#16a34a"/>
<text x="178" y="227" class="b">12</text>
<text x="165" y="296" class="c m">Todo M é P · 12 ∈ M ⇒ 12 ∈ P</text>
<text x="475" y="62" class="c b" style="fill:#991b1b">B: FALÁCIA (afirma o consequente)</text>
<circle cx="475" cy="175" r="90" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
<circle cx="475" cy="205" r="55" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
<text x="475" y="104" class="c b">P: pares</text>
<text x="475" y="190" class="c m">múltiplos de 4 (M)</text>
<circle cx="475" cy="128" r="6" fill="#dc2626"/>
<text x="488" y="133" class="b" style="fill:#991b1b">10 (contraexemplo)</text>
<text x="475" y="296" class="c m">10 ∈ P, mas 10 ∉ M ⇒ conclusão não decorre</text>
</svg>
