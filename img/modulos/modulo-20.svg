<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d">
<title id="t">Raciocínio de Hoare: tripla e wp</title>
<desc id="d">Tripla de Hoare com pré-condição x maior que 9, comando x recebe x mais 1 e pós-condição x maior que 10. A pré-condição é obtida substituindo x por x mais 1 na pós-condição. Abaixo, a regra do condicional com dois ramos.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#1e293b}.t{font-size:16px;font-weight:700}.m{font-size:12px;fill:#475569}.b{font-weight:700}.c{text-anchor:middle}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="20" y="28" class="t">Módulo 20 — Tripla de Hoare {P} C {Q}</text>
<rect x="30" y="48" width="170" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="115" y="72" class="c b">Pré-condição P</text><text x="115" y="96" class="c">{ x &gt; 9 }</text>
<rect x="235" y="48" width="170" height="66" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
<text x="320" y="72" class="c b">Comando C</text><text x="320" y="96" class="c">x := x + 1</text>
<rect x="440" y="48" width="170" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="525" y="72" class="c b">Pós-condição Q</text><text x="525" y="96" class="c">{ x &gt; 10 }</text>
<path d="M200 81H233M405 81H438" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M525 114V140H115V116" stroke="#d97706" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="320" y="158" class="c m">retrocesso: P = Q[x ← x + 1] = (x + 1 &gt; 10) ≡ (x &gt; 9)</text>
<rect x="30" y="180" width="580" height="118" rx="8" fill="#fff" stroke="#94a3b8"/>
<text x="46" y="204" class="b">Condicional: {V} SE a &gt; b ENTÃO max := a SENÃO max := b {max ≥ a ∧ max ≥ b}</text>
<rect x="50" y="218" width="250" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
<text x="175" y="240" class="c b">ramo ENTÃO</text><text x="175" y="262" class="c m">{a &gt; b} max := a {Q} ✔</text>
<rect x="340" y="218" width="250" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
<text x="465" y="240" class="c b">ramo SENÃO</text><text x="465" y="262" class="c m">{a ≤ b} max := b {Q} ✔</text>
<text x="320" y="294" class="c m" style="font-size:11px">Provadas as duas, a regra do condicional prova a tripla inteira.</text>
</svg>
