<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d">
<title id="t">Função como caixa preta e escopo</title>
<desc id="d">A função imposto recebe salario como parâmetro e devolve um valor: 3000 gera 300 e 6000 gera 1200. Variáveis locais da função não existem fora dela.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#1e293b}.t{font-size:16px;font-weight:700}.m{font-size:12px;fill:#475569}.b{font-weight:700}.c{text-anchor:middle}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="20" y="28" class="t">Módulo 12 — Função: entrada, regra interna, retorno</text>
<rect x="30" y="56" width="120" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="90" y="84" class="c b">parâmetro</text><text x="90" y="106" class="c">salario = 6000</text>
<rect x="220" y="46" width="210" height="190" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
<text x="325" y="72" class="c b">imposto(salario)</text>
<text x="325" y="96" class="c m">escopo local</text>
<rect x="238" y="108" width="174" height="64" rx="6" fill="#fff" stroke="#94a3b8"/>
<text x="325" y="132" class="c">SE salario &gt; 5000</text><text x="325" y="154" class="c">→ salario × 0,20</text>
<text x="325" y="196" class="c m">senão → salario × 0,10</text>
<text x="325" y="222" class="c m">variáveis internas somem ao sair</text>
<rect x="500" y="56" width="110" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="555" y="84" class="c b">retorno</text><text x="555" y="106" class="c">1200</text>
<path d="M150 91H218M430 91H498" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="30" y="148" width="150" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
<text x="105" y="167" class="c m">salario = 3000</text><text x="105" y="184" class="c b">→ 300</text>
<rect x="30" y="248" width="580" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="320" y="270" class="c b">Mesma função, vários usos: escreva uma vez, chame quantas vezes precisar.</text>
<text x="320" y="289" class="c m">Quem chama só vê a entrada e o retorno — não as variáveis de dentro.</text>
</svg>
