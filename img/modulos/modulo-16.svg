<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d">
<title id="t">Algoritmo guloso falha no troco</title>
<desc id="d">Moedas 1, 3 e 4 para troco 6. O guloso escolhe 4+1+1, três moedas; a solução ótima é 3+3, duas moedas.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#1e293b}.t{font-size:16px;font-weight:700}.m{font-size:12px;fill:#475569}.b{font-weight:700}.c{text-anchor:middle}</style>
<rect width="640" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="20" y="28" class="t">Módulo 16 — Guloso nem sempre é ótimo</text>
<text x="320" y="58" class="c">Moedas disponíveis: 1, 3 e 4 · Troco de <tspan class="b">6</tspan></text>
<rect x="30" y="76" width="285" height="170" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="172" y="102" class="c b" style="fill:#991b1b">Guloso (maior moeda primeiro)</text>
<g stroke-width="2" stroke="#7f1d1d" fill="#fecaca"><circle cx="90" cy="156" r="30"/><circle cx="172" cy="156" r="20"/><circle cx="238" cy="156" r="20"/></g>
<g class="c b"><text x="90" y="162" font-size="20">4</text><text x="172" y="161">1</text><text x="238" y="161">1</text></g>
<text x="172" y="212" class="c b">3 moedas</text><text x="172" y="232" class="c m">resto 2 forçou duas moedas de 1</text>
<rect x="325" y="76" width="285" height="170" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="467" y="102" class="c b" style="fill:#166534">Ótimo (programação dinâmica)</text>
<g stroke-width="2" stroke="#14532d" fill="#bbf7d0"><circle cx="415" cy="156" r="26"/><circle cx="500" cy="156" r="26"/></g>
<g class="c b"><text x="415" y="163" font-size="18">3</text><text x="500" y="163" font-size="18">3</text></g>
<text x="467" y="212" class="c b">2 moedas</text><text x="467" y="232" class="c m">dp[6] = min(dp[5]+1, dp[3]+1, dp[2]+1) = 2</text>
<text x="320" y="276" class="c b">Contraexemplo: um único caso derruba a "regra" gulosa.</text>
<text x="320" y="298" class="c m">Em moedas 1, 5, 10, 25 o guloso funciona; em 1, 3, 4 não. Prove antes de confiar.</text>
</svg>
